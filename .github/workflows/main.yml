name: MLOps

on: [push]

jobs:
  dvc-and-mlflow:
    runs-on: [self-hosted] 
    env:
      LD_LIBRARY_PATH: /home/junspring/anaconda3/envs/mlops/lib
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set DVC Local Config
        run: |
          conda run -n mlops --no-capture-output \
          dvc config --local cache.dir /media/junspring/JunSpring2/dvc_cache2

      - name: DVC Data Update
        run: |
          conda run -n mlops --no-capture-output \
          dvc update data.dvc

      - name: Reproduce Pipeline
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          conda run -n mlops --no-capture-output \
          python train.py

